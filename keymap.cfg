# Which keyboard keys and gamepad 0 buttons play each PSX button.
# One line per PSX button: button = name[, name...]
# Names are raylib's KeyboardKey and GamepadButton names without their
# KEY_ / GAMEPAD_BUTTON_ prefix (see raylib.h). Letter keys are key
# positions named after the US layout. # starts a comment.

up = UP, LEFT_FACE_UP
down = DOWN, LEFT_FACE_DOWN
left = LEFT, LEFT_FACE_LEFT
right = RIGHT, LEFT_FACE_RIGHT
cross = X, RIGHT_FACE_DOWN
circle = C, RIGHT_FACE_RIGHT
square = Z, RIGHT_FACE_LEFT
triangle = V, RIGHT_FACE_UP
l1 = A, LEFT_TRIGGER_1
r1 = S, RIGHT_TRIGGER_1
start = ENTER, MIDDLE_RIGHT
select = RIGHT_SHIFT, MIDDLE_LEFT
