# Which keyboard keys and gamepad 0 buttons press each of the 12 buttons.
# One line per button: N = name[, name...], N from 1 to 12, in any order.
# Names are raylib's KeyboardKey and GamepadButton names without their
# KEY_ / GAMEPAD_BUTTON_ prefix (see raylib.h). Letter keys are key
# positions named after the US layout. # starts a comment.
#
# bindings.default.cfg says what each button does in each mode.
# To change keys, copy this file to keymap.cfg, edit it and run make raylib.

1 = UP, LEFT_FACE_UP
2 = DOWN, LEFT_FACE_DOWN
3 = LEFT, LEFT_FACE_LEFT
4 = RIGHT, LEFT_FACE_RIGHT
5 = X, RIGHT_FACE_DOWN
6 = C, RIGHT_FACE_RIGHT
7 = Z, RIGHT_FACE_LEFT
8 = V, RIGHT_FACE_UP
9 = A, LEFT_TRIGGER_1
10 = S, RIGHT_TRIGGER_1
11 = ENTER, MIDDLE_RIGHT
12 = RIGHT_SHIFT, MIDDLE_LEFT
